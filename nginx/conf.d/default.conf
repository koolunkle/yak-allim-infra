# Docker 내장 DNS 명칭 동적 해석
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name localhost;

    # 무중단(Blue-Green) 배포용 동적 타겟 URL 참조 파일
    include /var/jenkins_home/deploy/service-url.inc;

    # 클라이언트 식별 정보 전달 및 HTTP/1.1 커넥션 유지 헤더
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Spring Boot API 라우팅 경로
    location / {
        proxy_pass $service_url;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # OCR 분석 처리 엔드포인트 경로
    location /api/ocr/ {
        proxy_pass $service_url;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 헬스체크 응답 엔드포인트
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # n8n 워크플로우 엔드포인트 경로
    location /n8n/ {
        proxy_pass http://yak-allim-n8n:5678/;
        
        # WebSocket 프로토콜 전환용 헤더
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Jenkins CI/CD 컨트롤러 프록시 경로
    location /jenkins/ {
        proxy_pass http://yak-allim-jenkins:8080/;
        
        proxy_read_timeout 90s;
    }
}
